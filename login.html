<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Dream Gym</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">
    <header class="header">
        <a href="index.html" class="logo">DREAM GYM</a>
        <a href="index.html" class="back-link">← VOLTAR</a>
    </header>

    <main class="login-main">
        <section class="login-card">
            <p class="eyebrow">BEM-VINDO DE VOLTA</p>
            <h1>Entre na sua conta</h1>
            <p class="login-intro">Continue acompanhando os seus treinos e a sua evolução.</p>
            <p class="access-notice">Esta é uma área reservada. Entre com a sua conta para aceder aos seus dados e ao seu plano.</p>

            <form id="login-form" class="login-form">
                <label class="form-field">
                    <span>E-mail</span>
                    <input type="email" name="email" autocomplete="email" placeholder="seuemail@exemplo.com" required>
                </label>

                <label class="form-field">
                    <span>Senha</span>
                    <input type="password" name="senha" autocomplete="current-password" placeholder="Digite sua senha" required>
                </label>

                <button type="submit" class="continue-button">ENTRAR</button>
                <p id="login-message" class="login-message" aria-live="polite"></p>
            </form>

            <a href="#" class="secondary-link">Esqueci minha senha</a>
            <p class="login-create">Ainda não tem uma conta? <a href="perfil.html">Criar perfil</a></p>
        </section>
    </main>

    <footer class="footer"><p>TREINE • REGISTRE • EVOLUA</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
</body>

</html>
